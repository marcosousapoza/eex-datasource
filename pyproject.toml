[project]
name = "eex-datasource"
version = "0.1.0"
description = "Typed synchronous client for the EEX Group DataSource REST API v2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["eex", "energy", "market-data", "trading", "transparency"]
authors = [
    { name = "Marco Sousa-Poza", email = "marco.sousapoza@ik.me" }
]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/marcosousapoza/eex-datasource"
Repository = "https://github.com/marcosousapoza/eex-datasource"
Issues = "https://github.com/marcosousapoza/eex-datasource/issues"

[project.optional-dependencies]
pandas = ["pandas>=2"]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "eex_datasource"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["eex_datasource"]
