[project]
name = "eex-datasource"
version = "0.1.0"
description = "A rate-limit aware Python client and incremental data store for EEX Group DataSource"
readme = "README.md"
authors = [
    { name = "Marco Sousa-Poza", email = "marco.sousapoza@ik.me" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
progress = ["tqdm>=4.67"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[project.scripts]
eex-datasource = "eex_datasource.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
