  ####
  #### Event data
  ####
  # Use case: The user is interested in newly arrived UMM data for a certain commodity and area.
  /umm/transparency/{commodity}/{area}/{facilityType}/{modifiedFrom}:
    get:
      description: |
        This endpoint includes newly arrived data on Urgent Market Messages (UMM) for power and gas units.
        
      operationId: getUrgentMarketMessages
      tags:
        - Urgent Market Messages for Transparency
      parameters:
        - $ref: '#/components/parameters/Commodity'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/FacilityType'
        - $ref: '#/components/parameters/ModifiedFrom'
        
        - name: modifiedTo
          description: The 'modifiedTo' parameter restrict the search for the given interval in which the data was distributed to a maximum of one year.
          in: query
          required: false
          schema:
            type: string
            format: date-time
        
        - name: eventStart
          description: The 'eventStart' parameter refers to the date and time on which the UMM started.
          in: query
          required: false
          schema:
            type: string
            format: date-time
        
        - name: eventStop
          description: The 'eventStop' parameter restrict the search for the given interval in which the UMM was valid to a maximum of one year.
          in: query
          required: false
          schema:
            type: string
            format: date-time
        
        - name: eventStatus
          description: |
            The 'eventStatus' parameter restrict the search for active or dismissed UMMs:
            - Active
            - Dismissed
          in: query
          required: false
          schema:
            type: string
            example: Active
        
        - name: companyID
          description: The companyID is the unique identifier of the reporting company.
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CompanyID'
        
        - name: facilityID
          description: The facilityID is the unique identifier of the facility.
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FacilityID'
        
        - name: unitID
          description: The unitID is the unique identifier of the unit.
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UnitID'
        
        - name: controlArea
          description: |
            The field 'controlArea' indicates the control area to which the corresponding unit is connected.
            The following values are supported:
            - TenneT (DE)
            - TransnetBW
            - Amprion
            - 50Hertz
            - APG
            - CEPS
            - SwissGrid
            - Elia
            - TenneT (NL)
            - MAVIR
            - National Grid
            - PSE
            - Terna
            - REE
            - RTE
            - Transelectrica
            - EirGrid
            - Energinet
            - DK2
            - IPTO
            - Svenska Kraftnät
          in: query
          required: false
          schema:
            type: string
            example: Amprion
            
        - name: marketArea
          description: |
            The field 'marketArea' indicates the market area to which the corresponding unit is connected.
            The following values are supported:
            - CEGH
            - PSV IT
            - VOB
            - TTF
            - THE
            - VTP-FI
            - FINLAND_GAS_BALZ
            - GAS_SYS_ESTONIA
            - BALTIC-BAL
            - VTP-LT
            - VTP-DK
            - VTP Greece
            - Gaspool
            - NCG
          in: query
          required: false
          schema:
            type: string
            example: THE
            
        - name: fuelType
          description:  |
            The field fuelType gives additional information on the source of energy used by the production or generation unit concerned.
            This field is only relevant for power generation reference data, time series data and UMMs.
            Currently supported values are:
            - Biomass
            - Fossil Brown coal/Lignite
            - Fossil Coal-derived gas
            - Fossil Gas
            - Fossil Hard coal
            - Fossil Oil
            - Fossil Oil shale
            - Fossil Peat
            - Geothermal
            - Hydro Pumped Storage
            - Hydro Run-of-river and poundage
            - Hydro Water Reservoir
            - Marine
            - Nuclear
            - Other renewable
            - Solar
            - Waste
            - Wind Offshore
            - Wind Onshore
            - Other
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FuelType'
        
        - name: unavailabilityType
          description: |
            The field unavailabilityType indicates whether the unavailability was planned or unplanned.
            - Planned: means a programmed change in capacity (for example a maintenance, seasonal closing, etc.)
            - Unplanned: means a notprogramed change in capacity (for example an outage, forced limitation).
          in: query
          required: false
          schema:
            type: string
            example: Planned
        
        - name: messageID
          description: |
            The 'messageID' is the unique identifier of an event. This field aims to capture the identifier of the message issued by the market participant or by someone acting on its behalf. UMMs related to the same event may be updated several times before and during the event. Therefore, the field 'messageID' consists of two parts: ‘UMM thread ID’ and ‘Version Number’ separated by the underscore character. 'messageID' = 'UMM thread ID'_'Version Number'.

            'UMM thread ID' part is the identifier of a series of UMMs reporting on the same event after potential updates. The 'UMM thread ID' remains unchanged even if the UMM is updated. The format of the 'UMM thread ID' consists of two parts. The 'Event ID' (max. 20 charaters incl. leading 0s for the required lenght) and 'Unique ID' per unit (max. 4 digits).

            'Version Number' is the unique identifier of UMM versions in a single UMM thread. It helps to reconstruct the history of prior publications. It consists of a sequential number with 3 numeric characters where 001 stands for the first UMM in a thread, 002 marks the first update,003 the second update and so on.
            
            Example:
            - messageID =         0000000000M12-20664-6#598_002
              1) UMM thread ID =  0000000000M12-20664-6#598
                a) Event ID =     0000000000M12-20664-6
                b) Unique ID =    #598
              2) Version Number = _002
          in: query
          required: false
          schema:
            type: string
            example: 0000000000M12-20664-6#598_002
         
        - name: unavailabilityReason
          description: |
            The 'unavailabilityReason' parameter restrict the search for UMMs on the cause of the unavailability.
            - Outage
            - Maintenance
            - External factors
            - Other
          in: query
          required: false
          schema:
            type: string
            example: Outage
        
        - name: minOutage
          description: |
            The 'minOutage' parameter restrict the search for UMMs with a minimum unavailbale capacity.
          in: query
          required: false
          schema:
            type: integer
            format: int32
            example: 100
        
        - name: limit
          description: By default, the response is limited to 1000 records. The 'limit' parameter allows you to change this limit. In the API preview interface, an example value of 10 is shown to keep responses small, as the preview is not intended for large datasets.
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1000
            minimum: 1
            maximum: 60000
            example: 10
       
        - name: fields
          in: query
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
            example: ["commodity", "area"]
        
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/EventsResponse'
            text/csv:
              schema:
                type: string
                example: |-
                  a,b,c
                  v1,v2,v3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  
