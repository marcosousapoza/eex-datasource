  #
  # Adhoc messages
  #
  # Use case: The user is interested in newly arrived othger UMM data.
  /umm/transparency/other/{modifiedFrom}:
    get:
      description: |
        This endpoint includes newly arrived data on Urgent Market Messages (UMM) for “Other market information”. Typically these are events that are likely to significantly affect wholesale energy prices but are less structured and less frequent by nature than unavailability of units (for example: reporting corporate or market developments, commissioning a new power plant etc.).
        
      operationId: getAdHocMessages
      tags:
        - Urgent Market Messages for Transparency
      parameters:
        - $ref: '#/components/parameters/ModifiedFrom'
        
        - name: modifiedTo
          description: The 'modifiedTo' parameter restrict the search for the given interval in which the data was distributed to a maximum of one year.
          in: query
          required: false
          schema:
            type: string
            format: date-time
        
        - name: companyID
          description: The companyID is the unique identifier of the reporting company.
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CompanyID'
        
        - name: eventStatus
          description: |
            The 'status' parameter restrict the search for active or dismissed UMMs:
            - Active
            - Dismissed
          in: query
          required: false
          schema:
            type: string
            example: Active
        
        - name: adhocType
          description: |
            By default, an ad-hoc message is sent with the 'Simple'. There are additional types e.g. to explicitly disclose information with regards to the Marekt Abuse Regulation (MAR), grid loss (TSO), balancing market activities (Balancing) or technical status messages (TSM).
            Currently supported values are:
            - Simple
            - MAR
            - TSO
            - Balancing
            - TSM
          in: query
          required: false
          schema:
            type: string
            example: Simple
        
        - name: messageID
          description: |
            The 'messageID' is the unique identifier of an event. This field aims to capture the identifier of the message issued by the market participant or by someone acting on its behalf. UMMs related to the same event may be updated several times before and during the event. Therefore, the field 'messageID' consists of two parts: ‘UMM thread ID’ and ‘Version Number’ separated by the underscore character. 'messageID' = 'UMM thread ID'_'Version Number'.

            'UMM thread ID' part is the identifier of a series of UMMs reporting on the same event after potential updates. The 'UMM thread ID' remains unchanged even if the UMM is updated. The format of the 'UMM thread ID' consists of two parts. The 'Event ID' (max. 20 charaters incl. leading 0s for the required lenght) and 'Unique ID' per unit (max. 4 digits).

            'Version Number' is the unique identifier of UMM versions in a single UMM thread. It helps to reconstruct the history of prior publications. It consists of a sequential number with 3 numeric characters where 001 stands for the first UMM in a thread, 002 marks the first update,003 the second update and so on.
            
            Example:
            - messageID =         0000000000M12-20664-6#598_002
              1) UMM thread ID =  0000000000M12-20664-6#598
                a) Event ID =     0000000000M12-20664-6
                b) Unique ID =    #598
              2) Version Number = _002
          in: query
          required: false
          schema:
            type: string
         
        - name: limit
          description: By default, the response is limited to 1000 records. The 'limit' parameter allows you to change this limit. In the API preview interface, an example value of 10 is shown to keep responses small, as the preview is not intended for large datasets.
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1000
            minimum: 1
            maximum: 60000
            example: 10
          
        - name: fields
          in: query
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
            example: ["commodity", "area"]
      
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdHocEventsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/AdHocEventsResponse'
            text/csv:
              schema:
                type: string
                example: |-
                  a,b,c
                  v1,v2,v3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'


  # Use case: The user is interested in 'other UMM data within a given timeframe.
  /umm/transparency/other:
    get:
      description: |
        This endpoint includes data on Urgent Market Messages (UMM) for “Other market information”  that affect a specified time interval. Typically these are events that are likely to significantly affect wholesale energy prices but are less structured and less frequent by nature than unavailability of units (for example: reporting corporate or market developments, commissioning a new power plant etc.).
      operationId: getActualAdHocMessages
      tags:
        - Urgent Market Messages for Transparency
      parameters:
        - name: validityFrom
          description: The 'validityFrom' parameter refers to the starting of the affected time period.
          in: query
          required: true
          schema:
            type: string
            format: date-time
        
        - name: validityTo
          description: The 'validityTo' parameter restrict the search for the given interval in which the UMM was valid to a maximum of one year.
          in: query
          required: false
          schema:
            type: string
            format: date-time
            
        - name: companyID
          description: The companyID is the unique identifier of the reporting company.
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CompanyID'
        
        - name: eventStatus
          description: |
            The 'status' parameter restrict the search for active or dismissed UMMs:
            - Active
            - Dismissed
          in: query
          required: false
          schema:
            type: string
            example: Active
        
        - name: adhocType
          description: |
            By default, an ad-hoc message is sent with the 'Simple'. There are additional types e.g. to explicitly disclose information with regards to the Marekt Abuse Regulation (MAR), grid loss (TSO), balancing market activities (Balancing) or technical status messages (TSM).
