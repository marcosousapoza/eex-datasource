  ####
  #### Time series data
  ####
  /series/transparency/{commodity}/{area}/{symbol}/{from}:
    get:
      description: |
        This endpoint includes time series data from the EEX Transparency Platform for power and gas in a specified area, symbol and time interval.
      operationId: getTimeSeries
      tags:
        - Time Series for Transparency
      parameters:
        - $ref: '#/components/parameters/Commodity'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/From'
        
        - name: to
          description: The 'to' parameter restrict the search for the given interval series to a maximum of one year.
          in: query
          required: false
          schema:
            type: string
            format: date-time
        
        - name: fuelType
          description: |
            The field fuelType gives additional information on the source of energy used by the production or generation unit concerned.
            This field is only relevant for power generation reference data, time series data and UMMs.
            Currently supported values are:
            - Biomass
            - Fossil Brown coal/Lignite
            - Fossil Coal-derived gas
            - Fossil Gas
            - Fossil Hard coal
            - Fossil Oil
            - Fossil Oil shale
            - Fossil Peat
            - Geothermal
            - Hydro Pumped Storage
            - Hydro Run-of-river and poundage
            - Hydro Water Reservoir
            - Marine
            - Nuclear
            - Other renewable
            - Solar
            - Waste
            - Wind Offshore
            - Wind Onshore
            - Other
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FuelType'
        
        - name: controlArea
          description: |
            The field 'controlArea' indicates the control area to which the corresponding unit is connected.
            The following values are supported:
            - TenneT (DE)
            - TransnetBW
            - Amprion
            - 50Hertz
            - APG
            - CEPS
