openapi: '3.0.4'
info:
  title: Auctions API
  version: '1.1.1'
  description: |
    The Auction API provides access to EU Emissions Trading System (EU ETS) auction data. Auctioning is the main method for allocating emission allowances in the EU ETS.
    
    To support a deeper understanding of the auction environment, users are encouraged to consult various sources provided by the European Energy Exchange (EEX):
    - The <a href="https://www.eex.com/en/trading-resources/trading-information/rules-and-regulations#342" target="_blank">contract specifications</a> define the tradable products, delivery periods, and trading conditions. These are part of the official EEX Rules and Regulations.
    - The <a href="https://www.eex.com/en/trading-resources/trading-information/calendar" target="_blank">EEX Auction Calendar</a>
     outlines the operational days and schedules for derivatives and emissions spot trading.

    
    The EEX REST API is specified using the <a href="https://swagger.io/specification/v3/" target="_blank">OpenAPI standard</a>, which ensures a consistent and machine-readable definition of all endpoints and available data structures.

    **Previewing the endpoint results**
    The API website provides a preview feature to test endpoints and display small sample responses (an API key must be entered via the "Authorize" button to execute a call). It is intended for testing and is not designed for displaying large datasets. Therefore, an example value of 10 has been set to limit responses.
    These presets apply exclusively to the preview feature. Regular API calls can retrieve up to 60,000 rows per single request.

    <a href="/api-spec/auctions.yaml" target="_blank">Download of yaml file</a>
    

  license:
    name: Subscribe to EEX REST API
    url: https://webshop.eex-group.com/data-type/eex-environmentals-api-rt
    
  termsOfService: https://www.eex.com/en/market-data/eex-group-datasource/licensing-conditions
  
  contact:
    name: EEX | Market Data Services
    email: datasource@eex-group.com

  
servers:
  - url: https://api.eex-group.com/v2
    description: Base URL


security:
  - bearerAuth: []
  
components:
  schemas:
    # key fields
    
    AuctID:
      description: The ID identifying a unique auction.
      type: integer
      example: 3455
     
    AuctName:
      description: The name of a unique auction.
      type: string
      example: EEX EUA Primary Auction Spot
       
    ShortCode:
      description: The code identifying the unique contract of an auction.
      type: string
      example: T3PA
      
    ProductISIN:
      description: The ISIN of the unique contract of an auction.
      type: string
      example: DE000A1N5HU0
      
    AuctDate:
      description: Specifies the date on which the auction took place.
      type: string
      format: date
      example: "2025-11-18"
     
    AuctVol:
      description: The sell volume of an auction.
      type: integer
      example: 3268000
       
    AuctStatus:
      description: |
        The current status of an auction:
        - PUBL = Published
        - OPEN = Opened
        - CLOS = Closed
        - ACCE = Accepted
        - REJE = Rejected
        - CANC = Cancelled
      type: string
      example: ACCE
      
    # entitlement fields
      
    Area:
      description: The geographical Area an auction is referring to.
      type: string
      example: EU
      
    Cmdty:
      description: The commodity of the auction (always ENVIRONMENTALS).
      type: string
      example: ENVIRONMENTALS
      
    Currency:
      description: The currency of the AuctPx.
      type: string
      example: EUR
      
    StartTm:
      description: The starting time of an auction.
      type: string
      format: date-time
      example: "2025-11-18T08:00:00Z"
    
    EndTm:
      description: The ending time of an auction.
      type: string
      format: date-time
      example: "2025-11-18T10:00:00Z"
    AuctioneerName:
      description: The name of an auctioneer of an auction.
      type: string
      example: Auctioneer Austria
     
    AuctioneerVol:
      description: The volume offered by an auctioneer in an auction.
      type: integer
      example: 29000
     
    AuctioneerRev:
      description: The revenue generated by an auctioneer in an auction.
      type: number
      format: double
      example: 2331890.0
     
    Auctioneer:
      description: The auction results of individual auctioneers.
      type: object
      properties:
        AuctioneerName:
          $ref: '#/components/schemas/AuctioneerName'
        AuctioneerVol:
          $ref: '#/components/schemas/AuctioneerVol'
        AuctioneerRev:
          $ref: '#/components/schemas/AuctioneerRev'
      
    # data structures
      
    ReferenceData:
      description: The reference information is used for publication of auction information.
      type: object
      properties:
        AuctID:
          $ref: '#/components/schemas/AuctID'
        AuctDate:
          $ref: '#/components/schemas/AuctDate'
        AuctName:
          $ref: '#/components/schemas/AuctName'
        ShortCode:
          $ref: '#/components/schemas/ShortCode'
        ProductISIN:
          $ref: '#/components/schemas/ProductISIN'
        Area:
          $ref: '#/components/schemas/Area'
        Cmdty:
          $ref: '#/components/schemas/Cmdty'
        AuctVol:
          $ref: '#/components/schemas/AuctVol'
        AuctStatus:
          $ref: '#/components/schemas/AuctStatus'
        StartTm:
          $ref: '#/components/schemas/StartTm'
        EndTm:
          $ref: '#/components/schemas/EndTm'
        SmallestTrdUnit:
          description: The smallest increment tradable in an auction.
          type: integer
          example: 500
        SettlStart:
          description: |
            Refers to the ECC business day that the settlement happens.
            Currently, settleStart is always T+1 as all auctions are settled on the next business day after an auction.
            A different settleStart is only possible if there are changes in the corresponding legislation (currently settlement on the next business day is required) or EEX starts offering different types of auction.
          type: string
          example: T+1
        Currency:
          $ref: '#/components/schemas/Currency'
      
    AuctionIdentifier:
      description: Auction reference information used for END points.
      type: object
      properties:
        AuctID:
          $ref: '#/components/schemas/AuctID'
        ShortCode:
          $ref: '#/components/schemas/ShortCode'
        ProductISIN:
          $ref: '#/components/schemas/ProductISIN'
        Area:
          $ref: '#/components/schemas/Area'
        Cmdty:
          $ref: '#/components/schemas/Cmdty'
        AuctStatus:
          $ref: '#/components/schemas/AuctStatus'
        AuctDate:
          $ref: '#/components/schemas/AuctDate'
        StartTm:
          $ref: '#/components/schemas/StartTm'
        EndTm:
          $ref: '#/components/schemas/EndTm'
        Currency:
          $ref: '#/components/schemas/Currency'
      
    Results:
      description: Provides results data of an auction.
      allOf:
        - $ref: '#/components/schemas/AuctionIdentifier'
        - type: object
          properties:
            AuctPx:
              description: The execution price of an auction.
              type: number
              format: double
              example: 80.41
            MinBid:
              description: The minimum bid entered in an auction.
              type: number
              format: double
              example: 64.0
            MaxBid:
              description: The maximum bid entered in an auction.
              type: number
              format: double
              example: 83.0
            MeanBid:
              description: The mean bid entered in an auction.
              type: number
              format: double
              example: 80.02614
            MedianBid:
              description: The median bid entered in an auction.
              type: number
              format: double
              example: 80.155
            AuctTrdVol:
              description: The sell volume of an auction.
              type: integer
              example: 3268000
            TotalVolOfBids:
              description: The total volume of all bids entered in an auction.
              type: integer
              example: 5781000
            NumberOfBids:
              description: The total number of bids entered in an auction.
              type: integer
              example: 114
            NumberOfSuccessfulBids:
              description: The number of successful bids entered in an auction.
              type: integer
              example: 26
            AvgBidsPerBidder:
              description: The average number of bids entered in an auction per bidder.
              type: number
              format: double
              example: 4.071429
            AvgBidSize:
              description: The average volume of the bids entered in an auction.
              type: number
              format: double
              example: 50711.0
            AvgBidVolPerBidder:
              description: The average volume of the bids entered in an auction per bidder.
              type: number
              format: double
              example: 206464.285714
            StdDevVolPerBidder:
              description: The standard deviation of the bid volume entered in an auction per bidder.
              type: number
              format: double
              example: 307795.761614
            AvgSuccessfulBidVolPerBidder:
              description: The average volume of the successful bids entered in an auction per bidder.
              type: number
              format: double
              example: 192235.294118
            StdDevSuccessfulBidVolPerBidder:
              description: The standard deviation of the successful bids entered in an auction per bidder.
              type: number
              format: double
              example: 326450.478978
            CoverRatio:
              description: The total volume of all bids entered in an auction divided by the auction’s volume.
              type: number
              format: double
              example: 1.768972
            NumberOfBidders:
              description: The total number of bidders that entered bids in an auction.
              type: integer
              example: 28
            NumberOfSuccessfulBidders:
              description: The number of successful bidders of an auction.
              type: integer
              example: 17
            TotalAuctRev:
              description: The total revenue generated in an auction.
              type: number
              format: double
              example: 262779880.0
            Tm:
              description: The timestamp of the auction
              type: string
              format: date-time
              example: "2025-11-18T10:00:32.653Z"
    
    # revenues
      
    Revenues:
      description: Provides the revenues generated in an auction per auctioneer.
      allOf:
        - $ref: '#/components/schemas/AuctionIdentifier'
        - type: object
          properties:
            AuctPx:
              description: The execution price of an auction.
              type: number
              format: double
              example: 80.41
            AuctTrdVol:
              description: The sell volume of an auction.
              type: integer
              example: 3268000
            TotalAuctRev:
              description: The total revenue generated in an auction.
              type: number
              format: double
              example: 262779880.0
            Auctioneers:
              description: The auction results per individual auctioneer.
              type: array
              items:
                $ref: '#/components/schemas/Auctioneer'
              xml:
                wrapped: true
            Tm:
              description: The timestamp of the auction
              type: string
              format: date-time
              example: "2025-11-18T10:00:32.653Z"
      
    # Responses
      
    ReferenceDatasResponse:
      type: array
      items:
        $ref: '#/components/schemas/ReferenceData'
      xml:
        wrapped: true
        name: ReferenceDatas
      
    CmdtyResponse:
      type: array
      items:
        $ref: '#/components/schemas/Cmdty'
      xml:
        wrapped: true
        name: Cmdtys
        
    AreaResponse:
      type: array
      items:
        $ref: '#/components/schemas/Area'
      xml:
        wrapped: true
        name: Areas
    
    AuctDatesResponse:
      type: array
      items:
        $ref: '#/components/schemas/AuctDate'
      xml:
        wrapped: true
        name: AuctDates
      
    AuctIDResponse:
      type: array
      items:
        $ref: '#/components/schemas/AuctID'
      xml:
        wrapped: true
        name: AuctIDs
      
    ResultsResponse:
      type: array
      items:
        $ref: '#/components/schemas/Results'
      xml:
        wrapped: true
        name: Results
      
    RevenuesResponse:
      type: array
      items:
        $ref: '#/components/schemas/Revenues'
      xml:
        wrapped: true
        name: Revenues
    
  parameters:
      
    Cmdty:
      in: path
      name: Cmdty
      required: true
      schema:
        $ref: '#/components/schemas/Cmdty'
      
    Area:
      in: path
      name: Area
      required: true
      schema:
        $ref: '#/components/schemas/Area'
      
    AuctDate:
      in: path
      name: AuctDate
      required: true
      schema:
        $ref: '#/components/schemas/AuctDate'
      
    AuctID:
      in: path
      name: AuctID
      required: true
      schema:
        $ref: '#/components/schemas/AuctID'
      
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    
  responses:
    BadRequest:
      description: "Bad Request: The request contains invalid parameters or data."

    UnauthenticatedError:
      description: "Unauthorised: Authentication failed. User needs to check the required permissions."

    ForbiddenError:
      description: "Forbidden: Access denied. User does not possess the required permissions to access this resource."

    NotFoundError:
      description: "Not Found: The requested resource could not be found. This may be due to a typo in the URL or an attempt to access a non-existent endpoint."

    RequestLimitReached:
      description: "Access Denied: Number of requests has exceeded the defined limit."

    InternalServerError:
      description: "Internal Server Error: An unexpected server error occurred. Please try again later or contact support if the issue persists."

    ServiceUnavailableError:
      description: "The requested service is temporarily unavailable. This could be due to server maintenance or high traffic. Please try again later."
    
    NotAcceptableError:
      description: "The 'limit' parameter is invalid. Please ensure it is an integer between 1 and 60000."
    
paths:
  /rd/auctions/:
    description: All available commodities.
    get:
      summary: Returns all available commodities.
      description: Provides all valid commodities.
      operationId: getRDCmdtys
      tags:
        - ReferenceData auctions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmdtyResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CmdtyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
          
  /rd/auctions/{Cmdty}/:
    description: All available areas.
    get:
      summary: Provides all areas for a specified commodity.
      description: Provides all valid areas for the specified commodity.
      operationId: getRDAreas
      tags:
        - ReferenceData auctions
      parameters:
        - $ref: '#/components/parameters/Cmdty'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  
  /rd/auctions/{Cmdty}/{Area}/:
    description: All available auction dates
    get:
      summary: Delivers all valid auction dates for a specified commodity & area.
      description: Provides all valid auction dates for the specified commodity and area combination.
      operationId: getRDDays
      tags:
        - ReferenceData auctions
      parameters:
        - $ref: '#/components/parameters/Cmdty'
        - $ref: '#/components/parameters/Area'
        
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctDatesResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/AuctDatesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  
    
  /rd/auctions/{Cmdty}/{Area}/{AuctDate}:
    get:
      summary: Generates all auctions for a specified  commodity, area & auction date.
      description: Provides all auctions for a provided commodity, area & auction date.
      operationId: getRDDay
      tags:
        - ReferenceData auctions
      parameters:
        - $ref: '#/components/parameters/Cmdty'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/AuctDate'
        
        - name: fields
          description: Leave blank to retrieve all fields, or enter specific fields to retrieve only those
          in: query
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceDatasResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReferenceDatasResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    
  /rd/auctions/{Cmdty}/{Area}/{AuctDate}/:
    get:
      summary:  Sends back all valid auction IDs for  for a specified commodity, area & auction date.
      description: Provides all valid auction IDs for commodity, area & auction date.
      operationId: getRDAuctIDDay
      tags:
        - ReferenceData auctions
      parameters:
        - $ref: '#/components/parameters/Cmdty'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/AuctDate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctIDResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/AuctIDResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    
  /rd/auctions/{Cmdty}/{Area}/{AuctDate}/{AuctID}:
    get:
      summary: Presents single auction information for a specified commodity, area, trade date, short code & maturity.
      description: Single auction information
      operationId: getRDAuctionDay
      tags:
        - ReferenceData auctions
      parameters:
        - $ref: '#/components/parameters/Cmdty'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/AuctDate'
        - $ref: '#/components/parameters/AuctID'
        
        - name: fields
          description: Leave blank to retrieve all fields, or enter specific fields to retrieve only those
          in: query
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
        
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceDatasResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReferenceDatasResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    
  ####
  #### results
  ####
    
  /rslt/auctions/{Cmdty}/{Area}/{AuctDate}:
    get:
      summary: Returns all auction results for a specified commodity, area & auction date.
      description: all auction result on specific date
      operationId: getResultsDay
      tags:
        - Results auctions
      parameters:
        - $ref: '#/components/parameters/Cmdty'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/AuctDate'
          
        - name: limit
          description: |
            Leave blank to retrieve the maximum rows (60000), or enter the number of records you want to retrieve.
            In the API preview interface, an example value of 10 is set to limit responses, as the preview function is not designed for displaying large datasets.
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 60000
            example: 10
          
        - name: fields
          description: Leave blank to retrieve all fields, or enter specific fields to retrieve only those
          in: query
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
        
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ResultsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    
  /rslt/auctions/{Cmdty}/{Area}/{AuctDate}/{AuctID}:
    get:
      summary: Provides all auction results for a specified commodity, area, auction date & auction ID.
      description: Auction result for single auctionID on specific date
      operationId: getResultsAuctionIDDay
      tags:
        - Results auctions
      parameters:
        - $ref: '#/components/parameters/Cmdty'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/AuctDate'
        - $ref: '#/components/parameters/AuctID'
        
        - name: limit
          description: |
            Leave blank to retrieve the maximum rows (60000), or enter the number of records you want to retrieve.
            In the API preview interface, an example value of 10 is set to limit responses, as the preview function is not designed for displaying large datasets.
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 60000
            example: 10
        
        - name: fields
          description: Leave blank to retrieve all fields, or enter specific fields to retrieve only those
          in: query
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
        
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ResultsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
          $ref: '#/components/responses/NotAcceptableError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  
  /rslts/auctions/{Cmdty}/{Area}:
    get:
      summary: Returns all auction results for a specified commodity & area on a defined auction result series.
      description: all auction results for area and commodity during time period.
      operationId: getResultsArea
      tags:
        - Results series auctions
      parameters:
        - $ref: '#/components/parameters/Cmdty'
        - $ref: '#/components/parameters/Area'
          
        - name: from
          description: The start of the auction date range
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AuctDate'
          
        - name: to
          description: The end of the auction date range
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AuctDate'
          
        - name: limit
          description: |
            Leave blank to retrieve the maximum rows (60000), or enter the number of records you want to retrieve.
            In the API preview interface, an example value of 10 is shown to demonstrate usage and keep the response small, as the preview function is not designed for displaying large datasets.
          in: query
          required: false
          schema:
