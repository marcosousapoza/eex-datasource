  /sprs/spot/{Cmdty}/{Area}:
    get:
      summary: Returns all settlement prices for a specified commodity and area on a defined trade series.
      description: Returns all settlement prices for a specified commodity and area on a defined trade series.
      operationId: getSettleArea
      tags:
        - Settlement series spot
      parameters:
        - $ref: '#/components/parameters/Cmdty'
        - $ref: '#/components/parameters/Area'

        - name: from
          description: The start of the trade date range
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/TrdDate'

        - name: to
          description: The end of the trade date range
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/TrdDate'

