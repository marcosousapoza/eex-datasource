  ####
  #### top of books
  ####
  
  
  /tob/spot/{Cmdty}/{Area}/{TrdDate}/{ShortCode}:
    get:
      summary: Returns the most recent top of the order book values for a specified area, trade date and short code.
      description: |
        Returns the most recent top of the order book values for a specified area, trade date and short code.
          - Current TrdDate → Returns most recent TOB based on current time unless specified otherwise
          - Historic TrdDate → Returns end of day TOB for a specified trade date unless specified otherwise
      operationId: getTOBProductDay
      tags:
        - TopOfBook spot
      parameters:
        - $ref: '#/components/parameters/Cmdty'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/TrdDate'
        - $ref: '#/components/parameters/ShortCode'

        - name: timeTo
          description: |
            Optional parameter used to filter the response by a specific timestamp. When provided, the API returns only data that is valid up to the specified time.
            
            - Current TrdDate → Returns TOB valid at specified time for the current trade date
            - Historic TrdDate → Returns TOB valid at specified time for a specified trade date
          in: query
          required: false
          schema:
            type: string
            format: time
            example: "10:05:29.183"

        - name: fields
          description: Leave blank to retrieve all fields, or enter specific fields to retrieve only those (e.g.&fields=TrdDate,Cmdty,Area)
          in: query
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
      
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopOfBook'
            application/xml:
              schema:
                $ref: '#/components/schemas/TopOfBook'
            text/csv:
              schema:
                type: string
                example: |-
                  a,b,c
                  v1,v2,v3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RequestLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  
  # Time Series TopOfBooks
  
  
  /tobs/spot/{Cmdty}/{Area}/{TrdDate}/{ShortCode}:
    get:
      summary: Returns the top-of-book history for a specified time series of a given trade date based on the defined commodity, market area and short code.
      description: |
        Returns the top-of-book history for a specified time series of a given trade date based on the defined commodity, market area and short code.
        
          - Current TrdDate → Returns all TOB changes between a specified start time and a specified (optional) end time on the current trade date.
          - Historic TrdDate → Returns all TOB changes between a specified start time and a specified (optional) end time on a specified trade date.
      
      operationId: getTOBProduct
      tags:
        - TopOfBook series spot
      parameters:
        - $ref: '#/components/parameters/Cmdty'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/TrdDate'
        - $ref: '#/components/parameters/ShortCode'

        - name: timeFrom
          description: |
            Required parameter that defines the starting point of the time series for which top-of-book data is requested.
            The API returns all relevant data from this timestamp onward, up to the optional timeTo value if provided.
          in: query
          required: true
          schema:
            type: string
            format: time
            example: "10:00:29.183"

        - name: timeTo
          description: |
            Optional parameter that defines the end point of the time series for which top-of-book data is requested. When provided, the API returns only data that is valid up to the specified time.
          in: query
          required: false
          schema:
            type: string
            format: time
            example: "10:05:29.183"

        - name: limit
          description: |
            Leave blank to retrieve the maximum rows (60000), or enter the number of records you want to retrieve.
            In the API preview interface, an example value of 10 is set to limit responses, as the preview function is not designed for displaying large datasets.
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 60000
            example: 10

        - name: fields
          description: Leave blank to retrieve all fields, or enter specific fields to retrieve only those (e.g.&fields=TrdDate,Cmdty,Area)
          in: query
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
      
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopOfBooksResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/TopOfBooksResponse'
            text/csv:
              schema:
                type: string
                example: |-
                  a,b,c
                  v1,v2,v3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '406':
